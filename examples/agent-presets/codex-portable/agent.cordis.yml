# Minimal agent-preset example for experimental Dual Checkpoint compaction.
# Manual /compact is Portable-first and attempts one Codex Native Checkpoint;
# automatic and explicit-region compaction remain Portable-only. Copy this
# complete group into a user/deployer preset that supplies tools/persona.
# Do not load compaction-basic beside this Adapter: ctx.compaction has one owner.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-codex-dual
      name: 'dsh-codex-auth/compaction'
      config:
        auto: true

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
