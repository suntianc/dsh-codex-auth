# Minimal agent-preset example for the experimental Codex compaction Adapter.
# It intentionally contains only the compaction realm; copy this complete group
# into a user/deployer-authored preset that supplies the desired tools/persona.
# Do not load compaction-basic beside this Adapter: ctx.compaction has one owner.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-codex-portable
      name: 'dsh-codex-auth/compaction'
      config:
        auto: true

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
